AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC provider and least-privilege Match N Catch deployment role.

Parameters:
  ProjectName:
    Type: String
    Default: match-n-catch
  GitHubRepository:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubOidcSubject:
    Type: String
    Default: ''
    AllowedPattern: '^$|^repo:[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+:ref:refs/heads/main$'
    ConstraintDescription: >-
      must be empty or the immutable GitHub OIDC subject for the main branch,
      for example repo:owner@123/repository@456:ref:refs/heads/main
  CreateGitHubOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  CreateProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  UseExplicitGitHubOidcSubject: !Not [!Equals [!Ref GitHubOidcSubject, '']]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
      Tags:
        - Key: asbg
          Value: sguday

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-actions'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !If
                  - UseExplicitGitHubOidcSubject
                  - !Ref GitHubOidcSubject
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: DeployMatchNCatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PushBackendImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource:
                  Fn::ImportValue:
                    Fn::Sub: '${ProjectName}-Registry-BackendRepositoryArn'
              - Sid: GetEcrLoginToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: DeployEcsService
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RunTask
                  - ecs:TagResource
                Resource: '*'
              - Sid: PassOnlyApplicationTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::ImportValue:
                      Fn::Sub: '${ProjectName}-Application-TaskExecutionRoleArn'
                  - Fn::ImportValue:
                      Fn::Sub: '${ProjectName}-Application-TaskRoleArn'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ReadInfrastructureOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'
              - Sid: SyncExistingFrontendBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::match-n-catch-bucket'
              - Sid: WriteExistingFrontendBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::match-n-catch-bucket/*'
      Tags:
        - Key: asbg
          Value: sguday

Outputs:
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub '${ProjectName}-GithubOidc-RoleArn'
