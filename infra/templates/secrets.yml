AWSTemplateFormatVersion: '2010-09-09'
Description: Match N Catch application secret and non-sensitive existing RDS connection metadata.

Parameters:
  ProjectName:
    Type: String
    Default: match-n-catch
  RdsMasterSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  RdsEndpointAddress:
    Type: String
  RdsEndpointPort:
    Type: Number
    Default: 3306
  DatabaseName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_]+$'

Resources:
  DjangoSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/django/secret-key'
      Description: Generated Django SECRET_KEY for Match N Catch ECS tasks
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: asbg
          Value: sguday

Outputs:
  DjangoSecretArn:
    Value: !Ref DjangoSecret
    Export:
      Name: !Sub '${ProjectName}-Secrets-DjangoSecretArn'
  RdsMasterSecretArn:
    Value: !Ref RdsMasterSecretArn
    Export:
      Name: !Sub '${ProjectName}-Secrets-RdsMasterSecretArn'
  RdsEndpointAddress:
    Value: !Ref RdsEndpointAddress
    Export:
      Name: !Sub '${ProjectName}-Secrets-RdsEndpointAddress'
  RdsEndpointPort:
    Value: !Ref RdsEndpointPort
    Export:
      Name: !Sub '${ProjectName}-Secrets-RdsEndpointPort'
  DatabaseName:
    Value: !Ref DatabaseName
    Export:
      Name: !Sub '${ProjectName}-Secrets-DatabaseName'
