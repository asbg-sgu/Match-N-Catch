AWSTemplateFormatVersion: '2010-09-09'
Description: Match N Catch application secret and references to the managed RDS secret.

Parameters:
  ProjectName:
    Type: String
    Default: match-n-catch

Resources:
  DjangoSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/django/secret-key'
      Description: Generated Django SECRET_KEY for Match N Catch ECS tasks
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: asbg
          Value: sguday

Outputs:
  DjangoSecretArn:
    Value: !Ref DjangoSecret
    Export:
      Name: !Sub '${ProjectName}-Secrets-DjangoSecretArn'
  RdsMasterSecretArn:
    Value:
      Fn::ImportValue:
        Fn::Sub: '${ProjectName}-Data-MasterUserSecretArn'
    Export:
      Name: !Sub '${ProjectName}-Secrets-RdsMasterSecretArn'
  RdsEndpointAddress:
    Value:
      Fn::ImportValue:
        Fn::Sub: '${ProjectName}-Data-DatabaseEndpointAddress'
    Export:
      Name: !Sub '${ProjectName}-Secrets-RdsEndpointAddress'
  RdsEndpointPort:
    Value:
      Fn::ImportValue:
        Fn::Sub: '${ProjectName}-Data-DatabaseEndpointPort'
    Export:
      Name: !Sub '${ProjectName}-Secrets-RdsEndpointPort'
  DatabaseName:
    Value:
      Fn::ImportValue:
        Fn::Sub: '${ProjectName}-Data-DatabaseName'
    Export:
      Name: !Sub '${ProjectName}-Secrets-DatabaseName'
