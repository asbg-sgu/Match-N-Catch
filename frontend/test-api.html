<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test - Match & Catch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
      background: linear-gradient(135deg, #0b1426 0%, #1a2744 100%);
      color: #fff;
      min-height: 100vh;
    }
    h1 { margin-bottom: 1rem; }
    .section { background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .section h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #4fd2ff; }
    button {
      background: #3ddc84;
      color: #0b1426;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin: 0.25rem;
    }
    button:hover { background: #50f197; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .success { color: #3ddc84; }
    .error { color: #ff5c72; }
    .info { color: #4fd2ff; }
    input {
      padding: 0.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      background: rgba(0,0,0,0.2);
      color: #fff;
      margin: 0.25rem;
    }
    .status { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; margin-left: 0.5rem; }
    .status.online { background: #3ddc84; color: #0b1426; }
    .status.offline { background: #ff5c72; color: #fff; }
  </style>
</head>
<body>
  <h1>🧪 API Connection Test</h1>

  <div class="section">
    <h2>Backend Status</h2>
    <p>
      API Endpoint: <strong id="endpoint">Loading...</strong>
      <span id="status-badge" class="status">Checking...</span>
    </p>
    <button onclick="testHealth()">🔍 Check Health</button>
    <button onclick="checkMode()">📊 Check Mode</button>
    <div id="health-result" class="result" style="display:none;"></div>
  </div>

  <div class="section">
    <h2>Player API</h2>
    <input type="text" id="mssv" placeholder="MSSV (VD: 2212345)" value="2212345">
    <input type="text" id="name" placeholder="Tên (VD: Test User)" value="Test User">
    <br>
    <button onclick="testRegister()">📝 Register Player</button>
    <button onclick="testCheckPlays()">🎮 Check Plays Left</button>
    <div id="player-result" class="result" style="display:none;"></div>
  </div>

  <div class="section">
    <h2>Game API</h2>
    <button onclick="testStartGame()">▶️ Start Game</button>
    <button onclick="testSubmitGame()" id="btn-submit" disabled>✅ Submit Game (need session)</button>
    <div id="game-result" class="result" style="display:none;"></div>
  </div>

  <div class="section">
    <h2>Leaderboard API</h2>
    <button onclick="testLeaderboard()">🏆 Get Leaderboard</button>
    <div id="lb-result" class="result" style="display:none;"></div>
  </div>

  <div class="section">
    <h2>Mode Control</h2>
    <button onclick="setMode('hybrid')">🔄 Hybrid Mode</button>
    <button onclick="setMode('api-only')">☁️ API-only Mode</button>
    <button onclick="setMode('offline')">📴 Offline Mode</button>
    <button onclick="clearData()">🗑️ Clear LocalStorage</button>
    <div id="mode-result" class="result" style="display:none;"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/backend-api.js"></script>
  <script src="js/game-api-connector.js"></script>

  <script>
    let sessionToken = null;
    let attemptId = null;

    function show(id, text, type = 'info') {
      const el = document.getElementById(id);
      el.style.display = 'block';
      el.className = 'result ' + type;
      el.textContent = text;
    }

    async function init() {
      document.getElementById('endpoint').textContent = BackendAPI.getConfig().baseURL;

      // Check health immediately
      const online = await BackendAPI.checkBackendHealth();
      const badge = document.getElementById('status-badge');
      badge.className = 'status ' + (online ? 'online' : 'offline');
      badge.textContent = online ? 'Online ✓' : 'Offline ✗';
    }

    async function testHealth() {
      try {
        const result = await BackendAPI.healthCheck();
        show('health-result', JSON.stringify(result, null, 2), 'success');
      } catch (e) {
        show('health-result', 'Error: ' + e.message, 'error');
      }
    }

    async function checkMode() {
      const mode = GameConnector.getMode();
      show('health-result', JSON.stringify(mode, null, 2), 'info');
    }

    async function testRegister() {
      const mssv = document.getElementById('mssv').value;
      const name = document.getElementById('name').value;
      try {
        const result = await BackendAPI.registerPlayer(mssv, name);
        show('player-result', JSON.stringify(result, null, 2), 'success');
      } catch (e) {
        show('player-result', 'Error: ' + e.message, 'error');
      }
    }

    async function testCheckPlays() {
      const mssv = document.getElementById('mssv').value;
      try {
        const result = await GameConnector.checkPlaysLeft(mssv);
        show('player-result', JSON.stringify(result, null, 2), 'success');
      } catch (e) {
        show('player-result', 'Error: ' + e.message, 'error');
      }
    }

    async function testStartGame() {
      const mssv = document.getElementById('mssv').value;
      const name = document.getElementById('name').value;
      try {
        const result = await BackendAPI.startGame(mssv, name);
        sessionToken = result.session_token;
        attemptId = result.attempt_id;
        document.getElementById('btn-submit').disabled = false;
        show('game-result', 'Session started!\n\n' + JSON.stringify(result, null, 2), 'success');
      } catch (e) {
        show('game-result', 'Error: ' + e.message, 'error');
      }
    }

    async function testSubmitGame() {
      if (!attemptId) {
        show('game-result', 'Error: Start game first!', 'error');
        return;
      }
      try {
        const mockActionLogs = [
          { instance_id: 'card_1', card_id: 'q1', round: 1, action: 'tap_correct', client_timestamp_ms: Date.now() }
        ];
        const result = await BackendAPI.submitGame(attemptId, mockActionLogs, [], 5000);
        show('game-result', 'Game submitted!\n\n' + JSON.stringify(result, null, 2), 'success');
        sessionToken = null;
        attemptId = null;
        document.getElementById('btn-submit').disabled = true;
      } catch (e) {
        show('game-result', 'Error: ' + e.message, 'error');
      }
    }

    async function testLeaderboard() {
      try {
        const result = await GameConnector.fetchLeaderboard(10);
        show('lb-result', JSON.stringify(result, null, 2), 'success');
      } catch (e) {
        show('lb-result', 'Error: ' + e.message, 'error');
      }
    }

    function setMode(mode) {
      GameConnector.setMode(mode);
      show('mode-result', 'Mode set to: ' + mode + '\n\n' + JSON.stringify(GameConnector.getMode(), null, 2), 'success');
    }

    function clearData() {
      localStorage.clear();
      show('mode-result', 'LocalStorage cleared!', 'info');
    }

    init();
  </script>
</body>
</html>
