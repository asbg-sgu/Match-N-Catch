name: Backend CI/CD — GitHub OIDC → ECR → ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ecr-push.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: match-n-catch

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Lint backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/match-n-catch-github-actions
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: match-n-catch-github
      - name: Read CloudFormation outputs
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue | [0]" --output text
          }
          echo "ECR_REPOSITORY=$(output ${PROJECT_NAME}-registry BackendRepositoryUri)" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$(output ${PROJECT_NAME}-application EcsClusterName)" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=$(output ${PROJECT_NAME}-application EcsServiceName)" >> "$GITHUB_ENV"
          echo "TASK_DEFINITION=$(output ${PROJECT_NAME}-application TaskDefinitionArn)" >> "$GITHUB_ENV"
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        id: image
        run: |
          tag="sha-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 --push \
            --tag "${ECR_REPOSITORY}:latest" \
            --tag "${ECR_REPOSITORY}:${tag}" backend
          echo "uri=${ECR_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" \
            --query taskDefinition --output json > task-definition.raw.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)' \
            task-definition.raw.json > task-definition.json
      - name: Render task definition with immutable image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main
          image: ${{ steps.image.outputs.uri }}
      - name: Deploy task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: true
      - name: Run database migrations with the deployed task definition
        run: |
          network_configuration=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)
          task_definition=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          task_arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$task_definition" \
            --launch-type FARGATE --network-configuration "$network_configuration" \
            --overrides '{"containerOverrides":[{"name":"Main","command":["python","manage.py","migrate","--noinput"]}]}' \
            --tags key=asbg,value=sguday --query 'tasks[0].taskArn' --output text)
          test -n "$task_arn" && test "$task_arn" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[?name==`Main`].exitCode | [0]' --output text)
          test "$exit_code" = 0